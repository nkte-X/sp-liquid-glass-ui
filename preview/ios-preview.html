<!doctype html>
<!--
  Approximate mock of Super Productivity's mobile DOM, for tuning the
  iOS Liquid Glass theme without the app. Component styles below are
  hand-ported, simplified copies — always confirm on device.

  Query params:
    ?dark=1     dark theme
    ?ios=0      drop body.isIOS (Android-like)
    ?compose=1  show the global add-task bar (compose card)
    ?touch=0    desktop layout (no bottom nav, bar near the top)
    ?notheme=1  no installed theme (plugin's bundled theme only)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>iOS Liquid Glass preview</title>
<style>
  /* --- minimal app base (subset of _css-variables.scss / app shell) --- */
  body {
    --palette-primary-500: #007aff;
    --palette-primary-400: #3395ff;
    --palette-primary-600: #0062cc;
    --palette-primary-contrast-500: #fff;
    --brand: var(--palette-primary-600);
    --c-primary: var(--palette-primary-500);
    --c-contrast: #fff;
    --s: 8px; --s-half: 4px; --s2: 16px; --s3: 24px; --s7: 56px; --s8: 64px;
    --radius-md: 8px; --radius-xl: 16px; --card-border-radius: 8px;
    --transition-duration-s: 150ms; --transition-duration-l: 300ms;
    --safe-area-top: 47px; --safe-area-bottom: 34px; --safe-area-left: 0px; --safe-area-right: 0px;
    --bottom-nav-safe-area: var(--safe-area-bottom);
    --bottom-nav-height: 44px;
    --bottom-nav-extra-offset: 0px;
    --sidenav-bg-mobile: #fff;
    --bottom-nav-bg: var(--sidenav-bg-mobile);
    --divider-color: rgba(0,0,0,.1);
    --text-color-muted: rgba(60,60,67,.6);
    margin: 0; height: 100vh; overflow: hidden;
    padding-top: var(--safe-area-top); box-sizing: border-box;
    font: 15px/1.35 -apple-system, system-ui, sans-serif;
    color: var(--text-color);
  }
  .material-icon { font-family: system-ui; font-style: normal; display: inline-flex; align-items: center; justify-content: center; }
  button { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }

  /* --- app shell: .app-container > .main-content > .route-wrapper --- */
  .app-container { height: calc(100vh - var(--safe-area-top)); display: flex; flex-direction: column; }
  .main-content { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .has-mobile-bottom-nav .main-content {
    padding-bottom: calc(var(--bottom-nav-height) + var(--bottom-nav-safe-area) + var(--bottom-nav-extra-offset));
  }
  .route-wrapper { flex-grow: 1; position: relative; overflow: clip; }
  .route-wrapper > tag-task-page { position: absolute; inset: 0; overflow: hidden; }
  work-view { display: block; position: absolute; inset: 0; }
  work-view .today { position: absolute; inset: 0; overflow-y: auto; padding: 4px 12px var(--s8);
    display: flex; flex-direction: column; gap: var(--task-list-row-gap, 4px); box-sizing: border-box; }

  /* --- header (simplified main-header) --- */
  main-header { display: block; padding: 6px 12px 8px; }
  main-header .wrapper { display: flex; align-items: center; gap: 8px; }
  main-header .page-title { flex: 1; font-size: 20px; }
  main-header .header-action-group { display: flex; }
  main-header .mat-icon-button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }

  /* --- tasks --- */
  task .box { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 14px; flex: none;
    background: var(--task-c-bg); border: var(--task-border, none); box-shadow: var(--task-shadow); }
  task .check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text-color-muted); flex: none; }
  /* sub-tasks (port of _task-base.scss essentials) */
  task.parent { display: flex; flex-direction: column; gap: 0; }
  task .sub-tasks { display: flex; flex-direction: column; margin: 4px 8px 4px 24px; }
  /* app rule is (0,3,0) via encapsulation attributes; mirror that */
  .today .sub-tasks .box { border-radius: 0; min-height: 40px; background: var(--sub-task-c-bg); }
  .wall-photo { flex: none; height: 200px; border-radius: 18px;
    background: linear-gradient(135deg, #ff9a3c, #ff3c8e 45%, #6b3cff); }

  /* --- mobile-bottom-nav (port of component scss) --- */
  .mobile-bottom-nav { position: fixed; bottom: var(--bottom-nav-extra-offset); left: 0; right: 0;
    height: calc(var(--bottom-nav-height) + var(--bottom-nav-safe-area)); box-sizing: border-box;
    background: var(--bottom-nav-bg); align-items: center; justify-content: space-between;
    padding: 0 var(--s); padding-bottom: var(--bottom-nav-safe-area); z-index: 50; display: flex; }
  .mobile-bottom-nav .nav-button { flex: 1 1 0; display: flex; align-items: center; justify-content: center;
    height: var(--bottom-nav-height); min-width: 0; border-radius: var(--radius-xl); }
  .mobile-bottom-nav .nav-button.active { background: var(--sidenav-item-active-bg); color: var(--sidenav-active-text); }
  .mobile-bottom-nav .nav-button mat-icon { font-size: 24px; width: 24px; height: 24px; }
  .mobile-bottom-nav .add-task-button { flex: 0 0 var(--s7); width: var(--s7); height: var(--s7);
    margin: 0 var(--s) var(--s3); border-radius: 16px; background: var(--palette-primary-500); color: #fff; }

  /* --- add-task-bar.global (port, touch layout) --- */
  add-task-bar.global { position: fixed; left: 4px; right: 4px; bottom: calc(var(--safe-area-bottom) + var(--s2));
    z-index: 999; display: block; }
  add-task-bar.global + .backdrop { position: fixed; inset: 0; z-index: 998; background: rgba(0,0,0,.12); }
  .add-task-container { background-color: var(--bg-lighter); border-radius: var(--card-border-radius);
    box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px rgba(0,0,0,.14); }
  .input-section { display: flex; align-items: flex-start; }
  .main-input-wrap { flex: 1; padding: 10px 8px 10px 16px; }
  .main-input { display: block; width: 100%; border: 0; outline: 0; padding: 0; resize: none;
    font: 16px/1.4 inherit; background: transparent; color: inherit; }
  .main-input::placeholder { color: var(--text-color-muted); }
  .separator-box { padding: 4px; }
  .add-task-submit-btn { width: 36px; height: 36px; border-radius: 8px; background: var(--c-primary); color: #fff; display: grid; place-items: center; }
  .inline-action-controls { display: flex; border-right: 1px solid var(--divider-color); padding-right: 2px; margin-right: 2px; }
  .inline-action-controls .mat-mdc-icon-button { width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-color-muted); }
  add-task-bar-actions { display: block; position: relative; }
  .action-bar { display: flex; overflow-x: auto; border-top: 1px solid var(--divider-color); }
  .action-bar .action-btn { flex: none; min-width: 70px; height: 32px; padding: 0 8px; font-size: 12px; color: var(--text-color-muted); }
</style>
<link id="installed-theme" rel="stylesheet" href="../themes/ios-liquid-glass.css" />
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('notheme') === '1') document.getElementById('installed-theme')?.remove();
  addEventListener('DOMContentLoaded', () => {
    const b = document.body;
    if (q.get('touch') === '0') {
      // desktop: centred bar near the top, no bottom nav
      document.querySelector('.mobile-bottom-nav').remove();
      const bar = document.querySelector('add-task-bar.global');
      if (bar) Object.assign(bar.style, { top: '48px', bottom: 'auto', left: '5%', right: '5%' });
    } else {
      b.classList.add('hasMobileBottomNav', 'isTouchPrimary', 'isNativeMobile');
    }
    if (q.get('ios') !== '0') b.classList.add('isIOS');
    if (q.get('dark') === '1') b.classList.add('isDarkTheme');
    const list = document.querySelector('work-view .today');
    const titles = ['__parent__', 'Write design spec', 'Review tab bar geometry', 'Test on iPhone, light + dark',
      '__photo__', 'Content scrolls under the glass', 'Plan sprint', 'Reply to emails', 'Groceries',
      '__photo__', 'Book dentist', 'Read chapter 4', 'Call mom', 'Gym', 'Fix bike', 'Water plants'];
    for (const t of titles) {
      if (t === '__parent__') {
        const el = document.createElement('task');
        el.className = 'parent';
        el.innerHTML = '<div class="box"><span class="check"></span>Ship iOS theme</div>' +
          '<div class="sub-tasks">' +
          ['Tab bar', 'Compose card', 'Sub-task corners'].map((x) =>
            '<task><div class="box"><span class="check"></span>' + x + '</div></task>').join('') +
          '</div>';
        list.append(el);
        continue;
      }
      if (t === '__photo__') { const p = document.createElement('div'); p.className = 'wall-photo'; list.append(p); continue; }
      const el = document.createElement('task');
      el.innerHTML = '<div class="box"><span class="check"></span></div>';
      el.querySelector('.box').append(t);
      list.append(el);
    }
    if (q.get('compose') !== '1') document.querySelectorAll('add-task-bar, .backdrop').forEach((n) => n.remove());
  });
</script>
</head>
<body>
  <div class="app-container has-mobile-bottom-nav">
    <main-header>
      <div class="wrapper">
        <div class="page-title">Today</div>
        <div class="header-action-group primary-action-group">
          <button class="mat-icon-button"><mat-icon class="material-icon">⏱</mat-icon></button>
          <button class="mat-icon-button"><mat-icon class="material-icon">⋯</mat-icon></button>
        </div>
      </div>
    </main-header>

    <main class="main-content">
      <div class="route-wrapper">
        <tag-task-page><work-view><div class="today"></div></work-view></tag-task-page>
      </div>
    </main>

    <nav class="mobile-bottom-nav">
      <button class="nav-button active"><mat-icon class="material-icon">☀︎</mat-icon></button>
      <button class="nav-button"><mat-icon class="material-icon">▦</mat-icon></button>
      <button class="add-task-button"><mat-icon class="material-icon">＋</mat-icon></button>
      <button class="nav-button"><mat-icon class="material-icon">◷</mat-icon></button>
      <button class="nav-button"><mat-icon class="material-icon">☰</mat-icon></button>
    </nav>
  </div>

  <add-task-bar class="global">
    <div class="add-task-container isGlobalBarVariant">
      <div class="input-section">
        <div class="main-input-wrap"><div class="main-input-stack"><textarea class="main-input" rows="1" placeholder="Add task…"></textarea></div></div>
        <div class="right-button-controls">
          <div class="separator-box"><button class="add-task-submit-btn">＋</button></div>
        </div>
      </div>
      <add-task-bar-actions>
        <div class="action-bar">
          <div class="inline-action-controls">
            <button class="mat-mdc-icon-button">⌕</button>
            <button class="mat-mdc-icon-button">✎</button>
          </div>
          <button class="action-btn">Today</button>
          <button class="action-btn has-value">Inbox</button>
          <button class="action-btn">Tags</button>
          <button class="action-btn">Estimate</button>
        </div>
      </add-task-bar-actions>
    </div>
  </add-task-bar>
  <div class="backdrop"></div>
</body>
</html>
